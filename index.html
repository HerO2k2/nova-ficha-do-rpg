<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem - O Chamado do Mar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #e2e8f0;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(26, 44, 76, 0.3) 0%, transparent 75%),
                radial-gradient(circle at 0% 100%, rgba(30, 10, 20, 0.25) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Container dos Atributos */
        .attribute-container {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 0 auto;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.6);
        }

        /* Design do Escudo de Defesas */
        .shield-box {
            position: relative;
            width: 44px;
            height: 50px;
            background: #000000;
            clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        .shield-wrapper {
            filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.3));
        }

        /* Inputs e Selects */
        input[type="text"], input[type="number"], select, textarea {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }

        /* Remover setas nativas dos inputs de número */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .tab-btn {
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            border-bottom-color: #3b82f6;
            color: #60a5fa;
            background: rgba(30, 58, 138, 0.2);
        }

        .skill-row:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Losangos Individuais dos Atributos */
        .attribute-diamond {
            width: 72px;
            height: 72px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        .diamond-for {
            background: linear-gradient(135deg, #541838 0%, #290a1a 100%);
            border-color: #9d174d;
        }

        .diamond-int {
            background: linear-gradient(135deg, #3c1859 0%, #1e0d30 100%);
            border-color: #7e22ce;
        }

        .diamond-agi {
            background: linear-gradient(135deg, #0c453c 0%, #062421 100%);
            border-color: #0f766e;
        }

        .diamond-pre {
            background: linear-gradient(135deg, #0f2a52 0%, #07152b 100%);
            border-color: #1d4ed8;
        }

        .hold-btn {
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* ESTILO PARA EXPORTAÇÃO EM PDF / IMPRESSÃO */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            header, button, .hold-btn, .tab-btn, .no-print {
                display: none !important;
            }
            .tab-panel {
                display: block !important;
            }
            input, select, textarea {
                background: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
            }
            .shield-box {
                background: #ffffff !important;
                border: 2px solid #000000 !important;
            }
            .shield-box input {
                color: #000000 !important;
            }
            .attribute-diamond {
                border: 1px solid #000 !important;
                background: #f1f5f9 !important;
            }
            .attribute-diamond span {
                color: #000000 !important;
                text-shadow: none !important;
            }
            .attribute-diamond input {
                background: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #000 !important;
            }
            main {
                display: block !important;
            }
            section {
                background: #ffffff !important;
                border: 1px solid #ddd !important;
                margin-bottom: 20px !important;
                page-break-inside: avoid;
            }
            .text-emerald-400 {
                color: #047857 !important;
            }
            .text-amber-400 {
                color: #b45309 !important;
            }
            .text-slate-200, .text-slate-300, .text-slate-400 {
                color: #1e293b !important;
            }
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-5 pb-10">

    <!-- Top Header -->
    <header class="max-w-7xl mx-auto bg-slate-900/80 border border-slate-800 backdrop-blur-md rounded-xl p-3.5 mb-5 shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-3">
            <!-- Header Inputs -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full lg:w-auto flex-grow">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Personagem</label>
                    <input type="text" id="char-name" class="w-full px-2.5 py-1 rounded text-xs font-medium" placeholder="Nome do Personagem" onchange="saveData()">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ancestral</label>
                    <select id="char-ancestral" class="w-full px-2.5 py-1 rounded text-xs font-medium" onchange="applyAncestralBonus()">
                        <option value="">Selecione um Ancestral...</option>
                        <option value="Mafioso">Mafioso</option>
                        <option value="Mercenário">Mercenário</option>
                        <option value="Cavaleiro">Cavaleiro</option>
                        <option value="Artista">Artista</option>
                        <option value="Criminoso">Criminoso</option>
                        <option value="Investigador/Detetive">Investigador / Detetive</option>
                        <option value="Padre">Padre</option>
                        <option value="Caçador">Caçador</option>
                        <option value="Líder">Líder</option>
                        <option value="Xamã">Xamã</option>
                        <option value="Onmyoji">Onmyoji</option>
                        <option value="Samurai">Samurai</option>
                        <option value="Ninja">Ninja</option>
                        <option value="Mongol">Mongol</option>
                        <option value="Militar">Militar</option>
                        <option value="Policial">Policial</option>
                        <option value="Engenheiro">Engenheiro</option>
                        <option value="Apostador">Apostador</option>
                        <option value="Cultista">Cultista</option>
                        <option value="Cientista">Cientista</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Profissão</label>
                    <input type="text" id="char-class" class="w-full px-2.5 py-1 rounded text-xs font-medium" placeholder="Profissão" onchange="saveData()">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nível</label>
                    <input type="number" id="char-level" class="w-full px-2.5 py-1 rounded text-xs font-medium" placeholder="1" min="1" max="100" onchange="saveData()">
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="window.print()" class="bg-red-700 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-md font-semibold border border-red-500 flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-file-pdf"></i> Exportar em PDF
                </button>
                <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-md font-medium border border-slate-700 flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-md font-medium border border-slate-700 cursor-pointer flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-upload"></i> Importar
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
                <button onclick="resetData()" class="bg-red-950/40 hover:bg-red-900/60 text-red-300 text-xs px-2.5 py-1.5 rounded-md font-medium border border-red-800/50 flex items-center gap-1.5 transition" title="Resetar Ficha">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5">

        <!-- LEFT COLUMN: Attributes, Status Bars & Defenses -->
        <section class="lg:col-span-3 space-y-5 bg-slate-900/60 border border-slate-800/80 rounded-xl p-4 backdrop-blur-sm flex flex-col justify-between">
            <div>
                <!-- Campaign Title -->
                <h1 class="text-center font-cinzel text-lg font-bold tracking-widest text-slate-200 uppercase mb-3 border-b border-slate-800 pb-2">
                    O Chamado do Mar
                </h1>

                <!-- Radar Graph & Attribute Diamonds -->
                <div class="attribute-container my-2">
                    <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="75" fill="#050810" stroke="#1e293b" stroke-width="2" />
                        <circle cx="100" cy="100" r="55" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2" />
                        <circle cx="100" cy="100" r="35" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2" />
                        <circle cx="100" cy="100" r="15" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2" />

                        <line x1="100" y1="25" x2="100" y2="175" stroke="#1e293b" stroke-width="1" />
                        <line x1="25" y1="100" x2="175" y2="100" stroke="#1e293b" stroke-width="1" />

                        <polygon id="radar-polygon" points="100,100 100,100 100,100 100,100" 
                                 fill="rgba(56, 189, 248, 0.45)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />

                        <circle cx="100" cy="100" r="75" fill="none" stroke="#334155" stroke-width="1.5" />
                    </svg>

                    <!-- FOR (Topo) -->
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 z-10">
                        <div class="attribute-diamond diamond-for">
                            <span class="font-cinzel font-bold text-white text-[11px] tracking-wider drop-shadow">FOR</span>
                            <input type="number" id="attr-for" min="0" max="99" class="w-9 h-5 bg-black text-center text-amber-400 font-bold border border-slate-700 rounded text-xs mt-0.5" value="0" onchange="updateAttribute('FOR', this.value)">
                        </div>
                    </div>

                    <!-- INT (Esquerda) -->
                    <div class="absolute top-1/2 left-0 -translate-y-1/2 z-10">
                        <div class="attribute-diamond diamond-int">
                            <span class="font-cinzel font-bold text-white text-[11px] tracking-wider drop-shadow">INT</span>
                            <input type="number" id="attr-int" min="0" max="99" class="w-9 h-5 bg-black text-center text-amber-400 font-bold border border-slate-700 rounded text-xs mt-0.5" value="0" onchange="updateAttribute('INT', this.value)">
                        </div>
                    </div>

                    <!-- AGI (Direita) -->
                    <div class="absolute top-1/2 right-0 -translate-y-1/2 z-10">
                        <div class="attribute-diamond diamond-agi">
                            <span class="font-cinzel font-bold text-white text-[11px] tracking-wider drop-shadow">AGI</span>
                            <input type="number" id="attr-agi" min="0" max="99" class="w-9 h-5 bg-black text-center text-amber-400 font-bold border border-slate-700 rounded text-xs mt-0.5" value="0" onchange="updateAttribute('AGI', this.value)">
                        </div>
                    </div>

                    <!-- PRE (Embaixo) -->
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 z-10">
                        <div class="attribute-diamond diamond-pre">
                            <span class="font-cinzel font-bold text-white text-[11px] tracking-wider drop-shadow">PRE</span>
                            <input type="number" id="attr-pre" min="0" max="99" class="w-9 h-5 bg-black text-center text-amber-400 font-bold border border-slate-700 rounded text-xs mt-0.5" value="0" onchange="updateAttribute('PRE', this.value)">
                        </div>
                    </div>
                </div>

                <!-- Status Bars Section -->
                <div class="space-y-3.5 mt-5">
                    <!-- Vida (Vinho) -->
                    <div>
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Vida</span>
                            <div class="text-[10px] text-slate-400 flex items-center gap-1">
                                Máx: <input type="number" id="hp-max" class="w-10 h-4 text-center bg-slate-950 border border-slate-800 rounded text-[10px]" value="32" onchange="saveData()">
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onmousedown="startHold('hp', -5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('hp', -5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;&lt;</button>
                            <button onmousedown="startHold('hp', -1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('hp', -1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;</button>
                            <div onclick="toggleBarDisplay('hp')" class="flex-grow bg-slate-950 h-6 rounded relative overflow-hidden border border-red-900/50 flex items-center justify-center cursor-pointer select-none">
                                <div id="hp-bar" class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-[#88134d] to-[#b81d52] transition-all duration-300" style="width: 100%;"></div>
                                <span id="hp-display" class="relative z-10 text-white font-bold text-xs tracking-wider drop-shadow">32 / 32</span>
                            </div>
                            <button onmousedown="startHold('hp', 1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('hp', 1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;</button>
                            <button onmousedown="startHold('hp', 5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('hp', 5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;&gt;</button>
                        </div>
                    </div>

                    <!-- Escudo (Roxo) -->
                    <div>
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Escudo</span>
                            <div class="text-[10px] text-slate-400 flex items-center gap-1">
                                Máx: <input type="number" id="shield-max" class="w-10 h-4 text-center bg-slate-950 border border-slate-800 rounded text-[10px]" value="10" onchange="saveData()">
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onmousedown="startHold('shield', -5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('shield', -5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;&lt;</button>
                            <button onmousedown="startHold('shield', -1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('shield', -1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;</button>
                            <div onclick="toggleBarDisplay('shield')" class="flex-grow bg-slate-950 h-6 rounded relative overflow-hidden border border-purple-900/50 flex items-center justify-center cursor-pointer select-none">
                                <div id="shield-bar" class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-[#4b1c72] to-[#8b2cf5] transition-all duration-300" style="width: 100%;"></div>
                                <span id="shield-display" class="relative z-10 text-white font-bold text-xs tracking-wider drop-shadow">10 / 10</span>
                            </div>
                            <button onmousedown="startHold('shield', 1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('shield', 1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;</button>
                            <button onmousedown="startHold('shield', 5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('shield', 5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;&gt;</button>
                        </div>
                    </div>

                    <!-- Esforço (Azul) -->
                    <div>
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Esforço</span>
                            <div class="text-[10px] text-slate-400 flex items-center gap-1">
                                Máx: <input type="number" id="energy-max" class="w-10 h-4 text-center bg-slate-950 border border-slate-800 rounded text-[10px]" value="5" onchange="saveData()">
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onmousedown="startHold('energy', -5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('energy', -5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;&lt;</button>
                            <button onmousedown="startHold('energy', -1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('energy', -1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&lt;</button>
                            <div onclick="toggleBarDisplay('energy')" class="flex-grow bg-slate-950 h-6 rounded relative overflow-hidden border border-blue-900/50 flex items-center justify-center cursor-pointer select-none">
                                <div id="energy-bar" class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-[#14376b] to-[#1e64d4] transition-all duration-300" style="width: 100%;"></div>
                                <span id="energy-display" class="relative z-10 text-white font-bold text-xs tracking-wider drop-shadow">5 / 5</span>
                            </div>
                            <button onmousedown="startHold('energy', 1)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('energy', 1)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;</button>
                            <button onmousedown="startHold('energy', 5)" onmouseup="stopHold()" onmouseleave="stopHold()" ontouchstart="startHold('energy', 5)" ontouchend="stopHold()" class="hold-btn text-slate-400 hover:text-white px-1 text-xs font-bold">&gt;&gt;</button>
                        </div>
                    </div>
                </div>

                <!-- Defenses Section -->
                <div class="mt-5 border-t border-slate-800 pt-3">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center mb-2.5">Defesas & Resistências</h3>
                    <div class="grid grid-cols-3 gap-y-3 gap-x-1">
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">IMPACTO</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-impacto" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">CORTE</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-corte" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">PERFURAÇÃO</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-perfuracao" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">RITUAL</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-ritual" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">OCULTISMO</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-ocultismo" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] text-slate-400 font-semibold mb-1">QUEIMADURA</span>
                            <div class="shield-wrapper">
                                <div class="shield-box">
                                    <input type="number" id="def-queimadura" class="w-full bg-transparent text-center font-bold text-white text-xs focus:outline-none" value="0" onchange="saveData()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CENTER COLUMN: Skills Table -->
        <section class="lg:col-span-5 bg-slate-900/60 border border-slate-800/80 rounded-xl p-4 backdrop-blur-sm">
            <h2 class="text-center font-cinzel text-base font-bold tracking-widest text-slate-200 uppercase mb-3 border-b border-slate-800 pb-2">
                Perícias
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-800 font-semibold text-[11px]">

    <!-- App JavaScript Logic -->
    <script>
        const SKILLS_DATA = [
            { name: "Acrobacia", attr: "AGI" },
            { name: "Adestramento", attr: "PRE" },
            { name: "Arremesso", attr: "FOR" },
            { name: "Artes", attr: "INT" },
            { name: "Atletismo", attr: "FOR" },
            { name: "Atuação", attr: "PRE" },
            { name: "Atualidades", attr: "INT" },
            { name: "Autoridade", attr: "PRE" },
            { name: "Ciências", attr: "INT" },
            { name: "Compostura", attr: "PRE" },
            { name: "Corte", attr: "AGI" },
            { name: "Direção", attr: "INT" },
            { name: "Enganação", attr: "PRE" },
            { name: "Etiqueta", attr: "PRE" },
            { name: "Fanatismo", attr: "PRE" },
            { name: "Fortitude", attr: "FOR" },
            { name: "Furtividade", attr: "AGI" },
            { name: "Imposição", attr: "FOR" },
            { name: "Intimidação", attr: "PRE" },
            { name: "Luta", attr: "FOR" },
            { name: "Medicina", attr: "INT" },
            { name: "Ocultismo", attr: "INT" },
            { name: "Percepção", attr: "INT" },
            { name: "Persuasão", attr: "PRE" },
            { name: "Pesquisa", attr: "INT" },
            { name: "Pontaria", attr: "AGI" },
            { name: "Reflexo", attr: "AGI" },
            { name: "Religião", attr: "INT" },
            { name: "Ritual", attr: "INT" },
            { name: "Sobrevivência", attr: "AGI" },
            { name: "Tática", attr: "FOR" },
            { name: "Vontade", attr: "PRE" }
        ];

        const ANCESTRAL_BONUSES = {
            "Mafioso": { "Intimidação": 2, "Luta": 1 },
            "Mercenário": { "Tática": 1, "Corte": 1, "Luta": 1 },
            "Cavaleiro": { "Corte": 2, "Compostura": 1 },
            "Artista": { "Artes": 1, "Atualidades": 1, "Vontade": 1 },
            "Criminoso": { "Direção": 1, "Corte": 1, "Tática": 1 },
            "Investigador/Detetive": { "Pontaria": 2, "Percepção": 1 },
            "Padre": { "Religião": 2, "Medicina": 1 },
            "Caçador": { "Sobrevivência": 2, "Furtividade": 1 },
            "Líder": { "Persuasão": 2, "Vontade": 1 },
            "Xamã": { "Ritual": 2, "Adestramento": 1 },
            "Onmyoji": { "Ocultismo": 2, "Ritual": 1 },
            "Samurai": { "Corte": 2, "Luta": 1 },
            "Ninja": { "Corte": 2, "Furtividade": 1 },
            "Mongol": { "Compostura": 1, "Vontade": 1, "Direção": 1 },
            "Militar": { "Pontaria": 2, "Tática": 1 },
            "Policial": { "Tática": 2, "Autoridade": 1 },
            "Engenheiro": { "Ciências": 2, "Pesquisa": 1 },
            "Apostador": { "Persuasão": 2, "Etiqueta": 1 },
            "Cultista": { "Ritual": 2, "Ocultismo": 1 },
            "Cientista": { "Ciências": 2, "Medicina": 1 }
        };

        let sheetData = {
            header: { name: "", ancestral: "", job: "", level: 1 },
            attributes: { FOR: 0, AGI: 0, INT: 0, PRE: 0 },
            bars: {
                hp: { current: 32, max: 32, mode: 'raw' },
                shield: { current: 10, max: 10, mode: 'raw' },
                energy: { current: 5, max: 5, mode: 'raw' }
            },
            defenses: { impacto: 0, corte: 0, perfuracao: 0, ritual: 0, ocultismo: 0, queimadura: 0 },
            skills: {},
            attacks: [],
            abilities: [],
            inventory: [],
            notes: ""
        };

        let holdTimer = null;
        let holdInterval = null;

        function startHold(type, amount) {
            adjustBar(type, amount);
            holdTimer = setTimeout(() => {
                holdInterval = setInterval(() => {
                    adjustBar(type, amount);
                }, 75);
            }, 300);
        }

        function stopHold() {
            if (holdTimer) clearTimeout(holdTimer);
            if (holdInterval) clearInterval(holdInterval);
            holdTimer = null;
            holdInterval = null;
        }

        function toggleBarDisplay(type) {
            if (!sheetData.bars[type].mode) sheetData.bars[type].mode = 'raw';
            sheetData.bars[type].mode = sheetData.bars[type].mode === 'raw' ? 'percent' : 'raw';
            updateBarUI(type);
            saveData();
        }

        function updateBarUI(type) {
            const displayElem = document.getElementById(`${type}-display`);
            const maxElem = document.getElementById(`${type}-max`);
            const barFill = document.getElementById(`${type}-bar`);

            let maxVal = parseInt(maxElem.value) || 1;
            let currentVal = sheetData.bars[type].current;

            if (currentVal < 0) currentVal = 0;
            if (currentVal > maxVal) currentVal = maxVal;

            sheetData.bars[type].current = currentVal;
            sheetData.bars[type].max = maxVal;

            const percentage = Math.min(100, Math.max(0, (currentVal / maxVal) * 100));
            barFill.style.width = `${percentage}%`;

            if (sheetData.bars[type].mode === 'percent') {
                displayElem.innerText = `${Math.round(percentage)}%`;
            } else {
                displayElem.innerText = `${currentVal} / ${maxVal}`;
            }
        }

        function adjustBar(type, amount) {
            const maxElem = document.getElementById(`${type}-max`);
            let maxVal = parseInt(maxElem.value) || 1;
            let currentVal = (sheetData.bars[type].current || 0) + amount;

            if (currentVal < 0) currentVal = 0;
            if (currentVal > maxVal) currentVal = maxVal;

            sheetData.bars[type].current = currentVal;
            updateBarUI(type);
            saveData();
        }

        function updateAttribute(attr, val) {
            sheetData.attributes[attr] = parseInt(val) || 0;
            updateRadarGraph();
            renderSkills();
            saveData();
        }

        function updateRadarGraph() {
            const maxVal = 10;
            const center = 100;
            const radius = 75;

            const getPos = (val, direction) => {
                const ratio = Math.min(Math.max(val, 0), maxVal) / maxVal;
                const dist = ratio * radius;
                switch (direction) {
                    case 'TOP': return { x: center, y: center - dist };
                    case 'RIGHT': return { x: center + dist, y: center };
                    case 'BOTTOM': return { x: center, y: center + dist };
                    case 'LEFT': return { x: center - dist, y: center };
                }
            };

            const pFOR = getPos(sheetData.attributes.FOR, 'TOP');
            const pAGI = getPos(sheetData.attributes.AGI, 'RIGHT');
            const pPRE = getPos(sheetData.attributes.PRE, 'BOTTOM');
            const pINT = getPos(sheetData.attributes.INT, 'LEFT');

            const pointsStr = `${pFOR.x},${pFOR.y} ${pAGI.x},${pAGI.y} ${pPRE.x},${pPRE.y} ${pINT.x},${pINT.y}`;
            document.getElementById("radar-polygon").setAttribute("points", pointsStr);
        }

        function applyAncestralBonus() {
            const ancestral = document.getElementById("char-ancestral").value;
            const bonuses = ANCESTRAL_BONUSES[ancestral] || {};

            SKILLS_DATA.forEach(skill => {
                if (!sheetData.skills[skill.name]) {
                    sheetData.skills[skill.name] = { bonus: 0, train: 0, other: 0 };
                }
                sheetData.skills[skill.name].bonus = bonuses[skill.name] || 0;
            });

            renderSkills();
            saveData();
        }

        function updateSkillVal(skillName, type, val) {
            if (!sheetData.skills[skillName]) {
                sheetData.skills[skillName] = { bonus: 0, train: 0, other: 0 };
            }
            sheetData.skills[skillName][type] = parseInt(val) || 0;
            renderSkills();
            saveData();
        }

        function getSkillTotal(skillName) {
            const s = sheetData.skills[skillName] || { bonus: 0, train: 0, other: 0 };
            return (s.bonus || 0) + (s.train || 0) + (s.other || 0);
        }

        function renderSkills() {
            const tbody = document.getElementById("skills-tbody");
            tbody.innerHTML = "";

            const skillOptions = ['<option value="Nenhuma">Perícia: Nenhuma</option>'];

            SKILLS_DATA.forEach(skill => {
                const sData = sheetData.skills[skill.name] || { bonus: 0, train: 0, other: 0 };
                const total = (sData.bonus || 0) + (sData.train || 0) + (sData.other || 0);
                const attrVal = sheetData.attributes[skill.attr] || 0;
                const rollTotal = total + attrVal;

                const isHighlighted = total > 0;
                const rowClass = isHighlighted ? "text-emerald-400 font-semibold" : "text-slate-300";

                skillOptions.push(`<option value="${skill.name}">${skill.name} (${rollTotal >= 0 ? '+' : ''}${rollTotal})</option>`);

                const tr = document.createElement("tr");
                tr.className = "skill-row border-b border-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="py-1 px-1 ${rowClass}">${skill.name}</td>
                    <td class="py-1 px-1 text-center text-slate-400">(${skill.attr})</td>
                    <td class="py-1 px-1 text-center font-mono text-slate-400">${sData.bonus || 0}</td>
                    <td class="py-1 px-1 text-center">
                        <input type="number" min="0" class="w-9 text-center py-0.5 rounded text-xs bg-slate-950/80 border border-slate-800" value="${sData.train || 0}" onchange="updateSkillVal('${skill.name}', 'train', this.value)">
                    </td>
                    <td class="py-1 px-1 text-center">
                        <input type="number" min="0" class="w-9 text-center py-0.5 rounded text-xs bg-slate-950/80 border border-slate-800" value="${sData.other || 0}" onchange="updateSkillVal('${skill.name}', 'other', this.value)">
                    </td>
                    <td class="py-1 px-1 text-center font-bold font-mono ${isHighlighted ? 'text-emerald-400' : 'text-slate-200'}">${total}</td>
                    <td class="py-1 px-1 text-center">
                        <button onclick="rollSkill('${skill.name}', ${rollTotal})" class="text-blue-400 hover:text-blue-300 p-0.5 transition" title="Rolar 1d20 + Total">
                            <i class="fa-solid fa-dice-d20"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("atk-skill").innerHTML = skillOptions.join('');
            document.getElementById("abi-skill").innerHTML = skillOptions.join('');
        }

        function switchTab(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));

            document.getElementById(`tab-${tabKey}`).classList.add('active');
            document.getElementById(`panel-${tabKey}`).classList.remove('hidden');
        }

        function rollDiceFormula(formula, addedBonus = 0) {
            let cleanFormula = formula.replace(/\s+/g, '').toLowerCase();

            if (cleanFormula.startsWith('d')) {
                cleanFormula = '1' + cleanFormula;
            }

            const diceRegex = /^(\d+)d(\d+)([\+\-]\d+)?$/;
            const match = cleanFormula.match(diceRegex);

            if (!match) {
                return { error: true, msg: "Formato inválido! Use ex: d20, 1d20+3, 2d6-1" };
            }

            const count = parseInt(match[1]);
            const sides = parseInt(match[2]);
            let modifier = match[3] ? parseInt(match[3]) : 0;
            modifier += addedBonus;

            if (count > 50 || sides > 1000) {
                return { error: true, msg: "Muitos dados ou lados excessivos." };
            }

            let rolls = [];
            let sum = 0;

            for (let i = 0; i < count; i++) {
                let roll = Math.floor(Math.random() * sides) + 1;
                rolls.push(roll);
                sum += roll;
            }

            const total = sum + modifier;
            return {
                error: false,
                formula: formula + (addedBonus > 0 ? ` (+${addedBonus} Perícia)` : ''),
                rolls: rolls,
                modifier: modifier,
                total: total
            };
        }

        function rollCustomDice() {
            const input = document.getElementById("dice-input");
            const formula = input.value.trim();
            if (!formula) return;

            const res = rollDiceFormula(formula);
            logDiceResult(res);
        }

        function quickRoll(sides) {
            const res = rollDiceFormula(`1d${sides}`);
            logDiceResult(res);
        }

        function rollSkill(skillName, bonus) {
            switchTab('dice');
            const modStr = bonus >= 0 ? `+${bonus}` : `${bonus}`;
            const res = rollDiceFormula(`1d20${modStr}`);
            res.label = `Perícia: ${skillName}`;
            logDiceResult(res);
        }

        function rollActionShortcut(name, diceFormula, skillName) {
            switchTab('dice');
            const skillBonus = getSkillTotal(skillName);
            const res = rollDiceFormula(diceFormula, skillBonus);
            if (!res.error) {
                res.label = `${name} ${skillName && skillName !== 'Nenhuma' ? `(Perícia: ${skillName})` : ''}`;
            }
            logDiceResult(res);
        }

        function logDiceResult(res) {
            const logContainer = document.getElementById("dice-log");

            if (logContainer.children.length === 1 && logContainer.children[0].tagName === 'P') {
                logContainer.innerHTML = "";
            }

            const card = document.createElement("div");
            card.className = "bg-slate-900 border border-slate-800 p-2 rounded text-xs space-y-1 shadow";

            if (res.error) {
                card.innerHTML = `<span class="text-red-400 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> ${res.msg}</span>`;
            } else {
                const rollsStr = res.rolls.join(", ");
                const modStr = res.modifier ? (res.modifier > 0 ? ` + ${res.modifier}` : ` - ${Math.abs(res.modifier)}`) : "";
                const labelStr = res.label ? `<div class="font-bold text-slate-300 text-[11px] mb-0.5">${res.label}</div>` : "";

                card.innerHTML = `
                    ${labelStr}
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-slate-400">${res.formula}</span>
                        <span class="text-base font-extrabold text-amber-400 font-mono">${res.total}</span>
                    </div>
                    <div class="text-[10px] text-slate-500 font-mono">Dados: [${rollsStr}] ${modStr}</div>
                `;
            }

            logContainer.prepend(card);
        }

        function clearDiceLog() {
            document.getElementById("dice-log").innerHTML = '<p class="text-xs text-slate-500 italic text-center">Nenhuma rolagem efetuada ainda.</p>';
        }

        function addAttack(e) {
            e.preventDefault();
            const name = document.getElementById("atk-name").value.trim();
            const damage = document.getElementById("atk-damage").value.trim();
            const skill = document.getElementById("atk-skill").value;
            const type = document.getElementById("atk-type").value;

            sheetData.attacks.push({ id: Date.now(), name, damage, skill, type });
            document.getElementById("attack-form").reset();
            saveData();
            renderAttacks();
        }

        function deleteAttack(id) {
            sheetData.attacks = sheetData.attacks.filter(a => a.id !== id);
            saveData();
            renderAttacks();
        }

        function renderAttacks() {
            const container = document.getElementById("attacks-list");
            container.innerHTML = "";

            if (sheetData.attacks.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-3">Nenhum ataque cadastrado.</p>`;
                return;
            }

            sheetData.attacks.forEach(atk => {
                const card = document.createElement("div");
                card.className = "bg-slate-950/80 border border-slate-800 p-2 rounded-lg flex items-center justify-between gap-2";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-xs text-slate-200">${atk.name}</div>
                        <div class="text-[10px] text-slate-400 font-mono">
                            Dano: ${atk.damage} | Perícia: ${atk.skill} | <span class="text-amber-400">${atk.type}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="rollActionShortcut('${atk.name}', '${atk.damage}', '${atk.skill}')" class="bg-blue-600/80 hover:bg-blue-600 text-white px-2 py-0.5 rounded text-[11px] font-bold transition flex items-center gap-1">
                            <i class="fa-solid fa-dice-d20"></i> Rolar
                        </button>
                        <button onclick="deleteAttack(${atk.id})" class="text-slate-500 hover:text-red-400 px-1 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addAbility(e) {
            e.preventDefault();
            const name = document.getElementById("abi-name").value.trim();
            const type = document.getElementById("abi-type").value;
            const damage = document.getElementById("abi-damage").value.trim();
            const skill = document.getElementById("abi-skill").value;
            const dmgType = document.getElementById("abi-dmg-type").value;
            const cooldown = document.getElementById("abi-cooldown").value.trim();
            const gain = document.getElementById("abi-gain").value.trim();
            const desc = document.getElementById("abi-desc").value.trim();

            sheetData.abilities.push({ id: Date.now(), name, type, damage, skill, dmgType, cooldown, gain, desc });
            document.getElementById("ability-form").reset();
            saveData();
            renderAbilities();
        }

        function deleteAbility(id) {
            sheetData.abilities = sheetData.abilities.filter(a => a.id !== id);
            saveData();
            renderAbilities();
        }

        function renderAbilities() {
            const container = document.getElementById("abilities-list");
            container.innerHTML = "";

            if (sheetData.abilities.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-3">Nenhuma habilidade cadastrada.</p>`;
                return;
            }

            sheetData.abilities.forEach(abi => {
                const card = document.createElement("div");
                card.className = "bg-slate-950/80 border border-slate-800 p-2 rounded-lg space-y-1";
                const typeBadge = abi.type === "Ativa" ? "bg-amber-950/60 text-amber-300 border-amber-800/50" : "bg-blue-950/60 text-blue-300 border-blue-800/50";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs text-slate-200">${abi.name}</span>
                            <span class="text-[9px] px-1.5 py-0.5 rounded border ${typeBadge}">${abi.type}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            ${abi.damage ? `
                                <button onclick="rollActionShortcut('${abi.name}', '${abi.damage}', '${abi.skill}')" class="bg-blue-600/80 hover:bg-blue-600 text-white px-2 py-0.5 rounded text-[10px] font-bold transition flex items-center gap-1">
                                    <i class="fa-solid fa-dice-d20"></i> Rolar
                                </button>
                            ` : ''}
                            <button onclick="deleteAbility(${abi.id})" class="text-slate-500 hover:text-red-400 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-400 space-x-2">
                        ${abi.damage ? `<span><b>Dano:</b> ${abi.damage} (${abi.dmgType})</span>` : ''}
                        ${abi.skill && abi.skill !== 'Nenhuma' ? `<span><b>Perícia:</b> ${abi.skill}</span>` : ''}
                        ${abi.cooldown ? `<span><b>CD:</b> ${abi.cooldown}</span>` : ''}
                        ${abi.gain ? `<span><b>Ganho:</b> ${abi.gain}</span>` : ''}
                    </div>
                    ${abi.desc ? `<p class="text-[11px] text-slate-300 pt-1 border-t border-slate-900 leading-tight">${abi.desc}</p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function addItem(e) {
            e.preventDefault();
            const name = document.getElementById("item-name").value.trim();
            const category = document.getElementById("item-category").value;
            const qtyInput = document.getElementById("item-qty").value;
            const qty = qtyInput !== "" ? parseInt(qtyInput) : "";
            const damage = document.getElementById("item-damage").value.trim();
            const dmgType = document.getElementById("item-dmg-type").value;
            const price = document.getElementById("item-price").value.trim();
            const ammoCur = document.getElementById("item-ammo-cur").value;
            const ammoMax = document.getElementById("item-ammo-max").value;
            const desc = document.getElementById("item-desc").value.trim();

            sheetData.inventory.push({
                id: Date.now(), name, category, qty, damage, dmgType, price,
                ammo: { current: ammoCur, max: ammoMax }, desc
            });

            document.getElementById("inventory-form").reset();
            saveData();
            renderInventory();
        }

        function deleteItem(id) {
            sheetData.inventory = sheetData.inventory.filter(i => i.id !== id);
            saveData();
            renderInventory();
        }

        function renderInventory() {
            const container = document.getElementById("inventory-list");
            container.innerHTML = "";

            if (sheetData.inventory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-3">Inventário vazio.</p>`;
                return;
            }

            sheetData.inventory.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-slate-950/80 border border-slate-800 p-2 rounded-lg space-y-1";
                const hasAmmo = item.ammo.current !== "" || item.ammo.max !== "";
                const ammoDisplay = hasAmmo ? `[ ${item.ammo.current || 0} / ${item.ammo.max || 0} ]` : "";

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-xs text-slate-200">${item.name}</span>
                            ${item.qty !== "" && item.qty !== undefined ? `<span class="text-[10px] text-slate-400 ml-1">x${item.qty}</span>` : ''}
                            <span class="text-[9px] text-slate-500 block">${item.category}</span>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-red-400 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="text-[10px] text-slate-400 flex flex-wrap gap-2">
                        ${item.damage ? `<span><b>Dano:</b> ${item.damage} (${item.dmgType})</span>` : ''}
                        ${item.price ? `<span><b>Valor:</b> $${item.price}</span>` : ''}
                        ${hasAmmo ? `<span class="text-amber-400"><b>Munição:</b> ${ammoDisplay}</span>` : ''}
                    </div>
                    ${item.desc ? `<p class="text-[11px] text-slate-300 pt-1 border-t border-slate-900 leading-tight">${item.desc}</p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function saveData() {
            sheetData.header.name = document.getElementById("char-name").value;
            sheetData.header.ancestral = document.getElementById("char-ancestral").value;
            sheetData.header.job = document.getElementById("char-class").value;
            sheetData.header.level = document.getElementById("char-level").value;

            sheetData.attributes.FOR = parseInt(document.getElementById("attr-for").value) || 0;
            sheetData.attributes.AGI = parseInt(document.getElementById("attr-agi").value) || 0;
            sheetData.attributes.INT = parseInt(document.getElementById("attr-int").value) || 0;
            sheetData.attributes.PRE = parseInt(document.getElementById("attr-pre").value) || 0;

            sheetData.defenses.impacto = parseInt(document.getElementById("def-impacto").value) || 0;
            sheetData.defenses.corte = parseInt(document.getElementById("def-corte").value) || 0;
            sheetData.defenses.perfuracao = parseInt(document.getElementById("def-perfuracao").value) || 0;
            sheetData.defenses.ritual = parseInt(document.getElementById("def-ritual").value) || 0;
            sheetData.defenses.ocultismo = parseInt(document.getElementById("def-ocultismo").value) || 0;
            sheetData.defenses.queimadura = parseInt(document.getElementById("def-queimadura").value) || 0;

            sheetData.notes = document.getElementById("notes-content").value;

            localStorage.setItem("rpg_sheet_data", JSON.stringify(sheetData));
        }

        function loadSavedData() {
            const saved = localStorage.getItem("rpg_sheet_data");
            if (!saved) return;

            try {
                sheetData = JSON.parse(saved);

                document.getElementById("char-name").value = sheetData.header.name || "";
                document.getElementById("char-ancestral").value = sheetData.header.ancestral || "";
                document.getElementById("char-class").value = sheetData.header.job || "";
                document.getElementById("char-level").value = sheetData.header.level || 1;

                document.getElementById("attr-for").value = sheetData.attributes.FOR || 0;
                document.getElementById("attr-agi").value = sheetData.attributes.AGI || 0;
                document.getElementById("attr-int").value = sheetData.attributes.INT || 0;
                document.getElementById("attr-pre").value = sheetData.attributes.PRE || 0;

                ['hp', 'shield', 'energy'].forEach(type => {
                    const b = sheetData.bars[type];
                    if (b) {
                        document.getElementById(`${type}-max`).value = b.max;
                        if (!b.mode) b.mode = 'raw';
                        updateBarUI(type);
                    }
                });

                document.getElementById("def-impacto").value = sheetData.defenses.impacto || 0;
                document.getElementById("def-corte").value = sheetData.defenses.corte || 0;
                document.getElementById("def-perfuracao").value = sheetData.defenses.perfuracao || 0;
                document.getElementById("def-ritual").value = sheetData.defenses.ritual || 0;
                document.getElementById("def-ocultismo").value = sheetData.defenses.ocultismo || 0;
                document.getElementById("def-queimadura").value = sheetData.defenses.queimadura || 0;

                document.getElementById("notes-content").value = sheetData.notes || "";

            } catch(e) {
                console.error("Erro ao carregar dados salvos:", e);
            }
        }

        function exportJSON() {
            saveData();
            const jsonStr = JSON.stringify(sheetData, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${sheetData.header.name || "personagem"}_ficha.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    sheetData = imported;
                    localStorage.setItem("rpg_sheet_data", JSON.stringify(sheetData));
                    loadSavedData();
                    updateRadarGraph();
                    renderSkills();
                    renderAttacks();
                    renderAbilities();
                    renderInventory();
                } catch(err) {
                    alert("Arquivo JSON inválido!");
                }
            };
            reader.readAsText(file);
        }

        function resetData() {
            if(confirm("Tem certeza que deseja resetar toda a ficha?")) {
                localStorage.removeItem("rpg_sheet_data");
                location.reload();
            }
        }

        window.onload = function() {
            loadSavedData();
            updateRadarGraph();
            renderSkills();
            renderAttacks();
            renderAbilities();
            renderInventory();
        };
    </script>
</body>
</html>
