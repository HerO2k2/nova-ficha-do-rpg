<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem RPG</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121824;
            --border-color: #2a3447;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-for: #8b1528; /* Vinho saturado */
            --accent-agi: #0d6e52; /* Verde saturado */
            --accent-int: #6b21a8; /* Roxo saturado */
            --accent-pre: #1e40af; /* Azul saturado */
            --skill-highlight: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            font-size: 14px;
        }

        /* BANNER TOPO / CONTROLES DE ARQUIVO */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-inputs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            flex: 1;
        }

        .header-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-field label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-field input, .header-field select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background: #334155;
        }

        .btn-pdf {
            background: #b91c1c;
            border-color: #ef4444;
        }
        .btn-pdf:hover {
            background: #dc2626;
        }

        /* GRID PRINCIPAL */
        .grid-container {
            display: grid;
            grid-template-columns: 320px 380px 1fr;
            gap: 15px;
        }

        @media (max-width: 1100px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ATRIBUTOS & RADAR GRAPH */
        .attributes-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .diamond-stat {
            position: absolute;
            width: 75px;
            height: 75px;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 2;
            border-radius: 6px;
        }

        .stat-content {
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        .stat-input {
            width: 36px;
            height: 22px;
            background: #000;
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border-radius: 3px;
            outline: none;
        }

        .stat-for { top: 10px; left: 102px; background: var(--accent-for); }
        .stat-agi { top: 102px; right: 10px; background: var(--accent-agi); }
        .stat-pre { bottom: 10px; left: 102px; background: var(--accent-pre); }
        .stat-int { top: 102px; left: 10px; background: var(--accent-int); }

        /* BARRAS DE STATUS */
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .bar-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bar-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 24px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bar-btn:active {
            background: #475569;
            color: #fff;
        }

        .bar-wrapper {
            flex: 1;
            height: 26px;
            background: #000;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.2s ease;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 2px #000;
        }

        .bar-max-input {
            width: 45px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: #fff;
            text-align: center;
            padding: 2px;
            border-radius: 4px;
            font-size: 11px;
        }

        .fill-vida { background: linear-gradient(90deg, #620d19, #ab1932); }
        .fill-escudo { background: linear-gradient(90deg, #4c1d95, #7e22ce); }
        .fill-esforco { background: linear-gradient(90deg, #1e3a8a, #2563eb); }

        /* DEFESAS */
        .defenses-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .defenses-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .defense-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .defense-label {
            font-size: 10px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .shield-svg-container {
            position: relative;
            width: 55px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shield-svg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .defense-input {
            position: relative;
            z-index: 2;
            width: 32px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        /* PERÍCIAS */
        .skills-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            text-align: center;
        }

        .skills-header div:first-child { text-align: left; }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 580px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .skill-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            align-items: center;
            font-size: 11px;
            gap: 2px;
        }

        .skill-name {
            font-weight: 600;
        }

        .skill-attr {
            color: var(--text-muted);
            text-align: center;
            font-size: 10px;
        }

        .skill-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            text-align: center;
            border-radius: 3px;
            padding: 2px;
            width: 100%;
            font-size: 11px;
        }

        .skill-total {
            text-align: center;
            font-weight: bold;
        }

        .skill-has-points {
            color: var(--skill-highlight);
        }

        /* MENU DE ABAS */
        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            gap: 5px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: #3b82f6;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* ROLADOR DE DADOS */
        .dice-section {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dice-input-group {
            display: flex;
            gap: 5px;
        }

        .dice-input-group input {
            flex: 1;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            outline: none;
        }

        .dice-log {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 100px;
            overflow-y: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2px;
        }
        .log-entry .result {
            color: #38bdf8;
            font-weight: bold;
        }

        /* TABELAS DINÂMICAS (ATAQUES, HABILIDADES, INVENTÁRIO) */
        .dynamic-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
        }

        .card-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .card-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-row input, .card-row select, .card-row textarea {
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
        }

        .card-row input[type="text"] { flex: 1; }
        
        .btn-delete {
            background: #7f1d1d;
            color: #fff;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            align-self: flex-end;
        }

        .notes-area {
            width: 100%;
            height: 350px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            resize: vertical;
            outline: none;
        }

        /* IMPRESSÃO / SALVAMENTO EM PDF FORMATADO */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0;
            }
            .top-bar .btn-group, .bar-controls button, .btn-delete, .btn, .tabs-header {
                display: none !important;
            }
            .grid-container {
                display: block !important;
            }
            .column {
                background: #fff !important;
                border: 1px solid #ccc !important;
                color: #000 !important;
                page-break-inside: avoid;
                margin-bottom: 15px;
            }
            .header-field input, .header-field select, .stat-input, .skill-input, .card-row input, .card-row select, .card-row textarea, .notes-area {
                background: #fff !important;
                color: #000 !important;
                border: 1px solid #999 !important;
            }
            .bar-wrapper {
                border: 1px solid #000 !important;
            }
            .bar-text {
                color: #000 !important;
                text-shadow: none !important;
            }
            .tab-content {
                display: flex !important;
            }
            .skills-list, .dynamic-list {
                max-height: none !important;
                overflow: visible !important;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="header-inputs">
            <div class="header-field">
                <label>Personagem</label>
                <input type="text" id="charName" oninput="saveData()">
            </div>
            <div class="header-field">
                <label>Ancestral</label>
                <select id="charAncestral" onchange="applyAncestralBonus(); saveData();">
                    <option value="">Selecione...</option>
                    <option value="Mafioso">Mafioso</option>
                    <option value="Mercenário">Mercenário</option>
                    <option value="Cavaleiro">Cavaleiro</option>
                    <option value="Artista">Artista</option>
                    <option value="Criminoso">Criminoso</option>
                    <option value="Investigador/Detetive">Investigador/Detetive</option>
                    <option value="Padre">Padre</option>
                    <option value="Caçador">Caçador</option>
                    <option value="Líder">Líder</option>
                    <option value="Xamã">Xamã</option>
                    <option value="Onmyoji">Onmyoji</option>
                    <option value="Samurai">Samurai</option>
                    <option value="Ninja">Ninja</option>
                    <option value="Mongol">Mongol</option>
                    <option value="Militar">Militar</option>
                    <option value="Policial">Policial</option>
                    <option value="Engenheiro">Engenheiro</option>
                    <option value="Apostador">Apostador</option>
                    <option value="Cultista">Cultista</option>
                    <option value="Cientista">Cientista</option>
                </select>
            </div>
            <div class="header-field">
                <label>Profissão</label>
                <input type="text" id="charClass" oninput="saveData()">
            </div>
            <div class="header-field">
                <label>Nível</label>
                <input type="number" id="charLevel" value="1" min="1" style="width: 60px;" oninput="saveData()">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-pdf" onclick="window.print()">🖨️ Exportar em PDF</button>
            <button class="btn" onclick="exportJSON()">💾 Salvar Dados (JSON)</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">📂 Carregar Dados</button>
            <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
        </div>
    </div>

    <!-- MAIN GRID -->
    <div class="grid-container">

        <!-- COLUNA 1: ATRIBUTOS, BARRAS E DEFESAS -->
        <div class="column">
            <!-- ATRIBUTOS RADAR -->
            <div class="attributes-container">
                <svg class="radar-svg" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="85" fill="#080c14" stroke="#1e293b" stroke-width="2"/>
                    <line x1="100" y1="15" x2="100" y2="185" stroke="#334155" stroke-dasharray="3,3"/>
                    <line x1="15" y1="100" x2="185" y2="100" stroke="#334155" stroke-dasharray="3,3"/>
                    <polygon id="radarPolygon" points="100,100 100,100 100,100 100,100" fill="rgba(56, 189, 248, 0.35)" stroke="#38bdf8" stroke-width="2"/>
                </svg>

                <div class="diamond-stat stat-for">
                    <div class="stat-content">
                        <span class="stat-label">FOR</span>
                        <input type="number" id="attr_for" class="stat-input" value="0" max="99" oninput="updateStats(); saveData();">
                    </div>
                </div>
                <div class="diamond-stat stat-agi">
                    <div class="stat-content">
                        <span class="stat-label">AGI</span>
                        <input type="number" id="attr_agi" class="stat-input" value="0" max="99" oninput="updateStats(); saveData();">
                    </div>
                </div>
                <div class="diamond-stat stat-pre">
                    <div class="stat-content">
                        <span class="stat-label">PRE</span>
                        <input type="number" id="attr_pre" class="stat-input" value="0" max="99" oninput="updateStats(); saveData();">
                    </div>
                </div>
                <div class="diamond-stat stat-int">
                    <div class="stat-content">
                        <span class="stat-label">INT</span>
                        <input type="number" id="attr_int" class="stat-input" value="0" max="99" oninput="updateStats(); saveData();">
                    </div>
                </div>
            </div>

            <!-- BARRAS INTERATIVAS -->
            <div class="bars-container">
                <!-- VIDA -->
                <div class="bar-group">
                    <div class="bar-header">
                        <span>VIDA</span>
                        <div>Máx: <input type="number" id="bar_vida_max" class="bar-max-input" value="32" oninput="updateBars(); saveData();"></div>
                    </div>
                    <div class="bar-controls">
                        <button class="bar-btn" onmousedown="startHold('vida', -5)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;&lt;</button>
                        <button class="bar-btn" onmousedown="startHold('vida', -1)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;</button>
                        <div class="bar-wrapper" onclick="toggleBarDisplay('vida')">
                            <div id="bar_vida_fill" class="bar-fill fill-vida" style="width: 100%;"></div>
                            <span id="bar_vida_text" class="bar-text">32 / 32</span>
                        </div>
                        <button class="bar-btn" onmousedown="startHold('vida', 1)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;</button>
                        <button class="bar-btn" onmousedown="startHold('vida', 5)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;&gt;</button>
                    </div>
                </div>

                <!-- ESCUDO (Roxo) -->
                <div class="bar-group">
                    <div class="bar-header">
                        <span>ESCUDO</span>
                        <div>Máx: <input type="number" id="bar_escudo_max" class="bar-max-input" value="10" oninput="updateBars(); saveData();"></div>
                    </div>
                    <div class="bar-controls">
                        <button class="bar-btn" onmousedown="startHold('escudo', -5)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;&lt;</button>
                        <button class="bar-btn" onmousedown="startHold('escudo', -1)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;</button>
                        <div class="bar-wrapper" onclick="toggleBarDisplay('escudo')">
                            <div id="bar_escudo_fill" class="bar-fill fill-escudo" style="width: 100%;"></div>
                            <span id="bar_escudo_text" class="bar-text">10 / 10</span>
                        </div>
                        <button class="bar-btn" onmousedown="startHold('escudo', 1)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;</button>
                        <button class="bar-btn" onmousedown="startHold('escudo', 5)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;&gt;</button>
                    </div>
                </div>

                <!-- ESFORÇO (Azul) -->
                <div class="bar-group">
                    <div class="bar-header">
                        <span>ESFORÇO</span>
                        <div>Máx: <input type="number" id="bar_esforco_max" class="bar-max-input" value="5" oninput="updateBars(); saveData();"></div>
                    </div>
                    <div class="bar-controls">
                        <button class="bar-btn" onmousedown="startHold('esforco', -5)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;&lt;</button>
                        <button class="bar-btn" onmousedown="startHold('esforco', -1)" onmouseup="stopHold()" onmouseleave="stopHold()">&lt;</button>
                        <div class="bar-wrapper" onclick="toggleBarDisplay('esforco')">
                            <div id="bar_esforco_fill" class="bar-fill fill-esforco" style="width: 100%;"></div>
                            <span id="bar_esforco_text" class="bar-text">5 / 5</span>
                        </div>
                        <button class="bar-btn" onmousedown="startHold('esforco', 1)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;</button>
                        <button class="bar-btn" onmousedown="startHold('esforco', 5)" onmouseup="stopHold()" onmouseleave="stopHold()">&gt;&gt;</button>
                    </div>
                </div>
            </div>

            <!-- DEFESAS -->
            <div class="defenses-title">DEFESAS & RESISTÊNCIAS</div>
            <div class="defenses-grid">
                <script>
                    const defs = ['Impacto', 'Corte', 'Perfuração', 'Ritual', 'Ocultismo', 'Queimadura'];
                    defs.forEach(d => {
                        const id = d.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        document.write(`
                            <div class="defense-item">
                                <span class="defense-label">${d.toUpperCase()}</span>
                                <div class="shield-svg-container">
                                    <svg class="shield-svg" viewBox="0 0 60 70">
                                        <path d="M 30 5 L 55 15 V 35 C 55 55 30 65 30 65 C 30 65 5 55 5 35 V 15 Z" fill="#000" stroke="#fff" stroke-width="2"/>
                                    </svg>
                                    <input type="number" id="def_${id}" class="defense-input" value="0" oninput="saveData()">
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>

        <!-- COLUNA 2: PERÍCIAS -->
        <div class="column">
            <div class="skills-header">
                <div>PERÍCIA</div>
                <div>ATTR</div>
                <div>BÔNUS</div>
                <div>TREINO</div>
                <div>OUTROS</div>
            </div>
            <div class="skills-list" id="skillsList"></div>
        </div>

        <!-- COLUNA 3: ABA INTERATIVA (DADOS, ATAQUES, HAB, INV, NOTAS) -->
        <div class="column">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('tab-combate')">Ataques</button>
                <button class="tab-btn" onclick="switchTab('tab-habilidades')">Habilidades</button>

            <div class="dice-section">
                <div class="dice-input-group">
                    <input type="text" id="diceFormula" placeholder="Ex: d20, 2d6+3, d4+2">
                    <button class="btn" onclick="rollCustomDice()">Rolar</button>
                </div>
                <div class="btn-group">
                    <button class="btn" onclick="quickRoll('d4')">d4</button>
                    <button class="btn" onclick="quickRoll('d6')">d6</button>
                    <button class="btn" onclick="quickRoll('d8')">d8</button>
                    <button class="btn" onclick="quickRoll('d10')">d10</button>
                    <button class="btn" onclick="quickRoll('d12')">d12</button>
                    <button class="btn" onclick="quickRoll('d20')">d20</button>
                    <button class="btn" onclick="quickRoll('d100')">d100</button>
                </div>
                <div class="dice-log" id="diceLog"></div>
            </div>

            <!-- ABA ATAQUES -->
            <div id="tab-combate" class="tab-content active">
                <button class="btn" onclick="addAttack()">+ Novo Ataque</button>
                <div class="dynamic-list" id="attacksList"></div>
            </div>

            <!-- ABA HABILIDADES -->
            <div id="tab-habilidades" class="tab-content">
                <button class="btn" onclick="addSkillCard()">+ Nova Habilidade</button>
                <div class="dynamic-list" id="habilidadesList"></div>
            </div>

            <!-- ABA INVENTÁRIO -->
            <div id="tab-inventario" class="tab-content">
                <button class="btn" onclick="addInventoryItem()">+ Novo Item</button>
                <div class="dynamic-list" id="inventoryList"></div>
            </div>

            <!-- ABA ANOTAÇÕES -->
            <div id="tab-anotacoes" class="tab-content">
                <textarea id="playerNotes" class="notes-area" placeholder="Escreva suas anotações aqui..." oninput="saveData()"></textarea>
            </div>
        </div>

    </div>

    <script>
        // LISTA COMPLETA DE PERÍCIAS SOLICITADAS
        const skillsData = [
            { name: "ACROBACIA", attr: "AGI" },
            { name: "ADESTRAMENTO", attr: "PRE" },
            { name: "ARREMESSO", attr: "FOR" },
            { name: "ARTES", attr: "INT" },
            { name: "ATLETISMO", attr: "FOR" },
            { name: "ATUALIDADES", attr: "INT" },
            { name: "AUTORIDADE", attr: "PRE" },
            { name: "CIÊNCIAS", attr: "INT" },
            { name: "COMPOSTURA", attr: "PRE" },
            { name: "CORTE", attr: "AGI" },
            { name: "DIREÇÃO", attr: "INT" },
            { name: "ENGANAÇÃO", attr: "PRE" },
            { name: "ETIQUETA", attr: "PRE" },
            { name: "FANATISMO", attr: "PRE" },
            { name: "FORTITUDE", attr: "FOR" },
            { name: "FURTIVIDADE", attr: "AGI" },
            { name: "IMPOSIÇÃO", attr: "FOR" },
            { name: "INTIMIDAÇÃO", attr: "PRE" },
            { name: "LUTA", attr: "FOR" },
            { name: "MEDICINA", attr: "INT" },
            { name: "OCULTISMO", attr: "INT" },
            { name: "PERCEPÇÃO", attr: "INT" },
            { name: "PERSUASÃO", attr: "PRE" },
            { name: "PESQUISA", attr: "INT" },
            { name: "PONTARIA", attr: "AGI" },
            { name: "REFLEXO", attr: "AGI" },
            { name: "RELIGIÃO", attr: "INT" },
            { name: "RITUAL", attr: "INT" },
            { name: "SOBREVIVÊNCIA", attr: "AGI" },
            { name: "TÁTICA", attr: "FOR" },
            { name: "VONTADE", attr: "PRE" }
        ];

        const ancestralBonuses = {
            "Mafioso": { "INTIMIDAÇÃO": 2, "LUTA": 1 },
            "Mercenário": { "TÁTICA": 1, "CORTE": 1, "LUTA": 1 },
            "Cavaleiro": { "CORTE": 2, "COMPOSTURA": 1 },
            "Artista": { "ARTES": 1, "ATUALIDADES": 1, "VONTADE": 1 },
            "Criminoso": { "DIREÇÃO": 1, "CORTE": 1, "TÁTICA": 1 },
            "Investigador/Detetive": { "PONTARIA": 2, "PERCEPÇÃO": 1 },
            "Padre": { "RELIGIÃO": 2, "MEDICINA": 1 },
            "Caçador": { "SOBREVIVÊNCIA": 2, "FURTIVIDADE": 1 },
            "Líder": { "PERSUASÃO": 2, "VONTADE": 1 },
            "Xamã": { "RITUAL": 2, "ADESTRAMENTO": 1 },
            "Onmyoji": { "OCULTISMO": 2, "RITUAL": 1 },
            "Samurai": { "CORTE": 2, "LUTA": 1 },
            "Ninja": { "CORTE": 2, "FURTIVIDADE": 1 },
            "Mongol": { "COMPOSTURA": 1, "VONTADE": 1, "DIREÇÃO": 1 },
            "Militar": { "PONTARIA": 2, "TÁTICA": 1 },
            "Policial": { "TÁTICA": 2, "AUTORIDADE": 1 },
            "Engenheiro": { "CIÊNCIAS": 2, "PESQUISA": 1 },
            "Apostador": { "PERSUASÃO": 2, "ETIQUETA": 1 },
            "Cultista": { "RITUAL": 2, "OCULTISMO": 1 },
            "Cientista": { "CIÊNCIAS": 2, "MEDICINA": 1 }
        };

        let barState = {
            vida: { cur: 32, mode: 'raw' },
            escudo: { cur: 10, mode: 'raw' },
            esforco: { cur: 5, mode: 'raw' }
        };

        let holdTimer = null;

        // INICIALIZAÇÃO
        window.onload = () => {
            renderSkills();
            loadData();
            updateStats();
            updateBars();
        };

        // RENDERIZAR PERÍCIAS
        function renderSkills() {
            const container = document.getElementById('skillsList');
            container.innerHTML = '';
            skillsData.forEach(sk => {
                const id = sk.name;
                container.innerHTML += `
                    <div class="skill-row" id="skill_row_${id}">
                        <span class="skill-name" id="skill_name_${id}">${sk.name}</span>
                        <span class="skill-attr">(${sk.attr})</span>
                        <input type="number" id="sk_bonus_${id}" class="skill-input" value="0" readonly>
                        <input type="number" id="sk_treino_${id}" class="skill-input" value="0" oninput="updateSkillTotal('${id}'); saveData();">
                        <input type="number" id="sk_outros_${id}" class="skill-input" value="0" oninput="updateSkillTotal('${id}'); saveData();">
                    </div>
                `;
            });
        }

        // BÔNUS DE ANCESTRAL
        function applyAncestralBonus() {
            const anc = document.getElementById('charAncestral').value;
            skillsData.forEach(sk => {
                document.getElementById(`sk_bonus_${sk.name}`).value = 0;
            });
            if (ancestralBonuses[anc]) {
                for (const [skName, val] of Object.entries(ancestralBonuses[anc])) {
                    const el = document.getElementById(`sk_bonus_${skName}`);
                    if (el) el.value = val;
                }
            }
            skillsData.forEach(sk => updateSkillTotal(sk.name));
        }

        function updateSkillTotal(id) {
            const b = parseInt(document.getElementById(`sk_bonus_${id}`).value) || 0;
            const t = parseInt(document.getElementById(`sk_treino_${id}`).value) || 0;
            const o = parseInt(document.getElementById(`sk_outros_${id}`).value) || 0;
            const total = b + t + o;
            
            const row = document.getElementById(`skill_row_${id}`);
            if (total > 0) {
                row.classList.add('skill-has-points');
            } else {
                row.classList.remove('skill-has-points');
            }
            return total;
        }

        function getSkillTotal(id) {
            if (!id) return 0;
            const b = parseInt(document.getElementById(`sk_bonus_${id}`)?.value) || 0;
            const t = parseInt(document.getElementById(`sk_treino_${id}`)?.value) || 0;
            const o = parseInt(document.getElementById(`sk_outros_${id}`)?.value) || 0;
            return b + t + o;
        }

        // GRÁFICO RADAR E STATUS
        function updateStats() {
            const f = parseInt(document.getElementById('attr_for').value) || 0;
            const a = parseInt(document.getElementById('attr_agi').value) || 0;
            const p = parseInt(document.getElementById('attr_pre').value) || 0;
            const i = parseInt(document.getElementById('attr_int').value) || 0;

            const center = 100;
            const maxR = 75;
            const maxVal = 10;

            const pFor = { x: center, y: center - Math.min(f / maxVal, 1) * maxR };
            const pAgi = { x: center + Math.min(a / maxVal, 1) * maxR, y: center };
            const pPre = { x: center, y: center + Math.min(p / maxVal, 1) * maxR };
            const pInt = { x: center - Math.min(i / maxVal, 1) * maxR, y: center };

            const points = `${pFor.x},${pFor.y} ${pAgi.x},${pAgi.y} ${pPre.x},${pPre.y} ${pInt.x},${pInt.y}`;
            document.getElementById('radarPolygon').setAttribute('points', points);
        }

        // BARRAS INTERATIVAS
        function updateBars() {
            ['vida', 'escudo', 'esforco'].forEach(b => {
                const max = parseInt(document.getElementById(`bar_${b}_max`).value) || 1;
                if (barState[b].cur > max) barState[b].cur = max;
                if (barState[b].cur < 0) barState[b].cur = 0;

                const pct = Math.max(0, Math.min(100, (barState[b].cur / max) * 100));
                document.getElementById(`bar_${b}_fill`).style.width = pct + '%';

                const textEl = document.getElementById(`bar_${b}_text`);
                if (barState[b].mode === 'raw') {
                    textEl.innerText = `${barState[b].cur} / ${max}`;
                } else {
                    textEl.innerText = `${Math.round(pct)}%`;
                }
            });
        }

        function toggleBarDisplay(b) {
            barState[b].mode = barState[b].mode === 'raw' ? 'pct' : 'raw';
            updateBars();
        }

        function changeBarVal(b, delta) {
            barState[b].cur += delta;
            updateBars();
            saveData();
        }

        function startHold(b, delta) {
            changeBarVal(b, delta);
            holdTimer = setInterval(() => changeBarVal(b, delta), 75);
        }

        function stopHold() {
            if (holdTimer) clearInterval(holdTimer);
        }

        // ABAS
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // ROLADOR DE DADOS
        function parseAndRoll(formula, skillName = '') {
            let cleanFormula = formula.toLowerCase().replace(/\s+/g, '');
            if (cleanFormula.startsWith('d')) {
                cleanFormula = '1' + cleanFormula;
            }

            const diceRegex = /^(\d+)d(\d+)([\+\-]\d+)?$/;
            const match = cleanFormula.match(diceRegex);

            let bonusSkill = getSkillTotal(skillName);
            let logMsg = '';

            if (match) {
                const count = parseInt(match[1]);
                const sides = parseInt(match[2]);
                const mod = parseInt(match[3]) || 0;

                let rolls = [];
                let sum = 0;
                for (let i = 0; i < count; i++) {
                    const r = Math.floor(Math.random() * sides) + 1;
                    rolls.push(r);
                    sum += r;
                }

                const total = sum + mod + bonusSkill;
                let skText = skillName ? ` + ${skillName}(${bonusSkill})` : '';
                logMsg = `[${formula}] 🎲 (${rolls.join('+')}) ${mod >= 0 ? '+' + mod : mod}${skText} = <span class="result">${total}</span>`;
            } else {
                try {
                    let total = eval(cleanFormula) + bonusSkill;
                    logMsg = `[${formula}] = <span class="result">${total}</span>`;
                } catch {
                    logMsg = `<span style="color:#ef4444">Fórmula inválida!</span>`;
                }
            }

            const logEl = document.getElementById('diceLog');
            logEl.innerHTML = `<div class="log-entry">${logMsg}</div>` + logEl.innerHTML;
        }

        function rollCustomDice() {
            const f = document.getElementById('diceFormula').value;
            if (f) parseAndRoll(f);
        }

        function quickRoll(d) {
            parseAndRoll(d);
        }

        // CARTÕES DE ATAQUES
        function addAttack(data = {}) {
            const container = document.getElementById('attacksList');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = 'card-item';
            div.id = `atk_${id}`;
            
            let skillOpts = `<option value="">Sem Perícia</option>`;
            skillsData.forEach(s => {
                skillOpts += `<option value="${s.name}" ${data.skill === s.name ? 'selected' : ''}>${s.name}</option>`;
            });

            const defTypes = ['Impacto', 'Corte', 'Perfuração', 'Ritual', 'Ocultismo', 'Queimadura'];
            let defOpts = '';
            defTypes.forEach(dt => {
                defOpts += `<option value="${dt}" ${data.type === dt ? 'selected' : ''}>${dt}</option>`;
            });

            div.innerHTML = `
                <div class="card-row">
                    <input type="text" placeholder="Nome do Ataque" value="${data.name || ''}" oninput="saveData()">
                    <input type="text" placeholder="Dano (ex: 1d4, 2d8)" value="${data.damage || ''}" style="width: 110px;" oninput="saveData()">
                    <button class="btn" onclick="rollAttackCard('${id}')">🎲 Rolar</button>
                    <button class="btn-delete" onclick="this.parentElement.parentElement.remove(); saveData();">X</button>
                </div>
                <div class="card-row">
                    <select class="atk-skill" onchange="saveData()">${skillOpts}</select>
                    <select class="atk-type" onchange="saveData()">${defOpts}</select>
                </div>
            `;
            container.appendChild(div);
        }

        function rollAttackCard(id) {
            const card = document.getElementById(`atk_${id}`);
            const dmg = card.querySelector('input[placeholder*="Dano"]').value;
            const skill = card.querySelector('.atk-skill').value;
            if (dmg) parseAndRoll(dmg, skill);
        }

        // CARTÕES DE HABILIDADES
        function addSkillCard(data = {}) {
            const container = document.getElementById('habilidadesList');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = 'card-item';
            div.id = `hab_${id}`;

            let skillOpts = `<option value="">Sem Perícia</option>`;
            skillsData.forEach(s => {
                skillOpts += `<option value="${s.name}" ${data.skill === s.name ? 'selected' : ''}>${s.name}</option>`;
            });

            const defTypes = ['Nenhum', 'Impacto', 'Corte', 'Perfuração', 'Ritual', 'Ocultismo', 'Queimadura'];
            let defOpts = '';
            defTypes.forEach(dt => {
                defOpts += `<option value="${dt}" ${data.type === dt ? 'selected' : ''}>${dt}</option>`;
            });

            div.innerHTML = `
                <div class="card-row">
                    <input type="text" placeholder="Nome da Habilidade" value="${data.name || ''}" oninput="saveData()">
                    <select class="hab-kind" onchange="saveData()">
                        <option value="Ativa" ${data.kind === 'Ativa' ? 'selected' : ''}>Ativa</option>
                        <option value="Passiva" ${data.kind === 'Passiva' ? 'selected' : ''}>Passiva</option>
                    </select>
                    <button class="btn" onclick="rollHabCard('${id}')">🎲 Rolar</button>
                    <button class="btn-delete" onclick="this.parentElement.parentElement.remove(); saveData();">X</button>
                </div>
                <div class="card-row">
                    <input type="text" placeholder="Dano (ex: d20, 2d6)" value="${data.damage || ''}" style="width: 110px;" oninput="saveData()">
                    <select class="hab-skill" onchange="saveData()">${skillOpts}</select>
                    <select class="hab-type" onchange="saveData()">${defOpts}</select>
                </div>
                <div class="card-row">
                    <input type="text" placeholder="Ganho (Suporte/Atributo)" value="${data.gain || ''}" oninput="saveData()">
                    <input type="text" placeholder="Cooldown" value="${data.cd || ''}" style="width: 90px;" oninput="saveData()">
                </div>
                <div class="card-row">
                    <textarea placeholder="Descrição da habilidade..." style="width:100%; height:45px;" oninput="saveData()">${data.desc || ''}</textarea>

        }

        function rollHabCard(id) {
            const card = document.getElementById(`hab_${id}`);
            const dmg = card.querySelector('input[placeholder*="Dano"]').value;
            const skill = card.querySelector('.hab-skill').value;
            if (dmg) parseAndRoll(dmg, skill);
        }

        // CARTÕES DE INVENTÁRIO
        function addInventoryItem(data = {}) {
            const container = document.getElementById('inventoryList');
            const div = document.createElement('div');
            div.className = 'card-item';

            const itemTypes = ['Arma de curto alcance', 'Médio alcance', 'Longo alcance', 'Arremessável', 'Armadura', 'Consumível', 'Item'];
            let typeOpts = '';
            itemTypes.forEach(it => {
                typeOpts += `<option value="${it}" ${data.type === it ? 'selected' : ''}>${it}</option>`;
            });

            const defTypes = ['Nenhum', 'Impacto', 'Corte', 'Perfuração', 'Ritual', 'Ocultismo', 'Queimadura'];
            let defOpts = '';
            defTypes.forEach(dt => {
                defOpts += `<option value="${dt}" ${data.dmgType === dt ? 'selected' : ''}>${dt}</option>`;
            });

            div.innerHTML = `
                <div class="card-row">
                    <input type="text" placeholder="Nome do Item" value="${data.name || ''}" oninput="saveData()">
                    <select onchange="saveData()">${typeOpts}</select>
                    <button class="btn-delete" onclick="this.parentElement.parentElement.remove(); saveData();">X</button>
                </div>
                <div class="card-row">
                    <input type="number" placeholder="Qtd" value="${data.qty || ''}" style="width: 60px;" oninput="saveData()">
                    <input type="text" placeholder="Dano" value="${data.damage || ''}" style="width: 80px;" oninput="saveData()">
                    <select onchange="saveData()">${defOpts}</select>
                    <input type="text" placeholder="Valor $" value="${data.price || ''}" style="width: 70px;" oninput="saveData()">
                    <input type="text" placeholder="Munição [10/20]" value="${data.ammo || ''}" style="width: 100px;" oninput="saveData()">
                </div>
                <div class="card-row">
                    <textarea placeholder="Descrição do item..." style="width:100%; height:40px;" oninput="saveData()">${data.desc || ''}</textarea>
                </div>
            `;
            container.appendChild(div);
        }

        // SALVAMENTO AUTOMÁTICO VIA LOCALSTORAGE
        function getSheetState() {
            const state = {
                header: {
                    name: document.getElementById('charName').value,
                    ancestral: document.getElementById('charAncestral').value,
                    class: document.getElementById('charClass').value,
                    level: document.getElementById('charLevel').value
                },
                attributes: {
                    for: document.getElementById('attr_for').value,
                    agi: document.getElementById('attr_agi').value,
                    pre: document.getElementById('attr_pre').value,
                    int: document.getElementById('attr_int').value
                },
                bars: {
                    vida: { cur: barState.vida.cur, max: document.getElementById('bar_vida_max').value },
                    escudo: { cur: barState.escudo.cur, max: document.getElementById('bar_escudo_max').value },
                    esforco: { cur: barState.esforco.cur, max: document.getElementById('bar_esforco_max').value }
                },
                defenses: {},
                skills: {},
                attacks: [],
                habilidades: [],
                inventory: [],
                notes: document.getElementById('playerNotes').value
            };

            defs.forEach(d => {
                const id = d.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                state.defenses[id] = document.getElementById(`def_${id}`).value;
            });

            skillsData.forEach(s => {
                state.skills[s.name] = {
                    treino: document.getElementById(`sk_treino_${s.name}`).value,
                    outros: document.getElementById(`sk_outros_${s.name}`).value
                };
            });

            document.querySelectorAll('#attacksList .card-item').forEach(card => {
                const inputs = card.querySelectorAll('input');
                const selects = card.querySelectorAll('select');
                state.attacks.push({
                    name: inputs[0].value,
                    damage: inputs[1].value,
                    skill: selects[0].value,
                    type: selects[1].value
                });
            });

            document.querySelectorAll('#habilidadesList .card-item').forEach(card => {
                const inputs = card.querySelectorAll('input');
                const selects = card.querySelectorAll('select');
                const txt = card.querySelector('textarea');
                state.habilidades.push({
                    name: inputs[0].value,
                    kind: selects[0].value,
                    damage: inputs[1].value,
                    skill: selects[1].value,
                    type: selects[2].value,
                    gain: inputs[2].value,
                    cd: inputs[3].value,
                    desc: txt.value
                });
            });

            document.querySelectorAll('#inventoryList .card-item').forEach(card => {
                const inputs = card.querySelectorAll('input');
                const selects = card.querySelectorAll('select');
                const txt = card.querySelector('textarea');
                state.inventory.push({
                    name: inputs[0].value,
                    type: selects[0].value,
                    qty: inputs[1].value,
                    damage: inputs[2].value,
                    dmgType: selects[1].value,
                    price: inputs[3].value,
                    ammo: inputs[4].value,
                    desc: txt.value
                });
            });

            return state;
        }

        function saveData() {
            const state = getSheetState();
            localStorage.setItem('rpg_sheet_data', JSON.stringify(state));
        }

        function loadData() {
            const dataStr = localStorage.getItem('rpg_sheet_data');
            if (!dataStr) return;
            const data = JSON.parse(dataStr);
            applyState(data);
        }

        function applyState(data) {
            if (data.header) {
                document.getElementById('charName').value = data.header.name || '';
                document.getElementById('charAncestral').value = data.header.ancestral || '';
                document.getElementById('charClass').value = data.header.class || '';
                document.getElementById('charLevel').value = data.header.level || 1;
            }

            if (data.attributes) {
                document.getElementById('attr_for').value = data.attributes.for || 0;
                document.getElementById('attr_agi').value = data.attributes.agi || 0;
                document.getElementById('attr_pre').value = data.attributes.pre || 0;
                document.getElementById('attr_int').value = data.attributes.int || 0;
            }

            if (data.bars) {
                document.getElementById('bar_vida_max').value = data.bars.vida.max || 32;
                barState.vida.cur = parseInt(data.bars.vida.cur) || 32;
                document.getElementById('bar_escudo_max').value = data.bars.escudo.max || 10;
                barState.escudo.cur = parseInt(data.bars.escudo.cur) || 10;
                document.getElementById('bar_esforco_max').value = data.bars.esforco.max || 5;
                barState.esforco.cur = parseInt(data.bars.esforco.cur) || 5;
            }

            if (data.defenses) {
                defs.forEach(d => {
                    const id = d.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    if (data.defenses[id] !== undefined) {
                        document.getElementById(`def_${id}`).value = data.defenses[id];
                    }
                });
            }

            applyAncestralBonus();

            if (data.skills) {
                skillsData.forEach(s => {
                    if (data.skills[s.name]) {
                        document.getElementById(`sk_treino_${s.name}`).value = data.skills[s.name].treino || 0;
                        document.getElementById(`sk_outros_${s.name}`).value = data.skills[s.name].outros || 0;
                        updateSkillTotal(s.name);
                    }
                });
            }

            document.getElementById('attacksList').innerHTML = '';
            if (data.attacks) data.attacks.forEach(atk => addAttack(atk));

            document.getElementById('habilidadesList').innerHTML = '';
            if (data.habilidades) data.habilidades.forEach(hab => addSkillCard(hab));

            document.getElementById('inventoryList').innerHTML = '';
            if (data.inventory) data.inventory.forEach(inv => addInventoryItem(inv));

            if (data.notes !== undefined) {
                document.getElementById('playerNotes').value = data.notes;
            }

            updateStats();
            updateBars();
        }

        // EXPORTAR E IMPORTAR JSON BACKUP
        function exportJSON() {
            const state = getSheetState();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${state.header.name || 'ficha'}_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    applyState(data);
                    saveData();
                    alert('Ficha carregada com sucesso!');
                } catch {
                    alert('Erro ao carregar o arquivo JSON!');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
